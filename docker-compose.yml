services:
  db:
    image: postgres:16-alpine
    container_name: ownmytwin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ownmytwin
    ports:
      - "5432:5432"
    volumes:
      - ownmytwin_db:/var/lib/postgresql/data

volumes:
  ownmytwin_db:
